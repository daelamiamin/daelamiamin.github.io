<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Daelami</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .profile-card {
      background-color: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      max-width: 500px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .profile-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.9);
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg,#00bcd4,#0097a7);
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5em;
      color: #fff;
      font-weight: bold;
      transition: transform 0.4s ease;
    }
    .avatar:hover {
      transform: rotate(10deg) scale(1.05);
    }
    h1 {
      margin: 0;
      font-size: 1.8em;
      color: #00bcd4;
      transition: color 0.3s ease;
    }
    h1:hover {
      color: #4dd0e1;
    }
    h2 {
      margin: 8px 0 20px;
      font-size: 1.2em;
      font-weight: normal;
      color: #9e9e9e;
    }
    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .skill {
      background-color: #2c2c2c;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.9em;
      transition: background 0.3s, transform 0.3s;
    }
    .skill:hover {
      background-color: #00bcd4;
      color: #0a0a0a;
      transform: scale(1.1);
    }
    .fact {
      font-style: italic;
      color: #b0bec5;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      background-color: #00bcd4;
      color: #0a0a0a;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s, transform 0.3s;
    }
    .btn:hover {
      background-color: #FFD700;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar">D</div>
    <h1>Daelami</h1>
    <h2>Cloud Support Trainee</h2>
    <div class="skills">
      <div class="skill">Linux</div>
      <div class="skill">Git</div>
      <div class="skill">Github</div>
      <div class="skill">Docker</div>
      <div class="skill">AWS</div>
      <div class="skill">Cloudflare</div>
    </div>
    <p class="fact">Fakta menarik: Technical</p>
    <a href="#" class="btn">Hubungi</a>
  </div>
</body>
</html>
