<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Daelami</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: #f0f0f0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      text-align: center;
      max-width: 350px;
    }
    .card h1 {
      margin: 0;
      font-size: 2em;
      color: #00bcd4;
    }
    .card h2 {
      margin: 10px 0;
      font-size: 1.2em;
      font-weight: normal;
      color: #9e9e9e;
    }
    .skills {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .skill {
      background-color: #2c2c2c;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.9em;
      color: #f0f0f0;
      transition: background 0.3s;
    }
    .skill:hover {
      background-color: #00bcd4;
      color: #121212;
    }
    .fact {
      font-style: italic;
      color: #b0bec5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Daelami</h1>
    <h2>Cloud Support Trainee</h2>
    <div class="skills">
      <div class="skill">Linux</div>
      <div class="skill">Git</div>
      <div class="skill">Docker</div>
      <div class="skill">AWS</div>
    </div>
    <p class="fact">Fakta menarik: Technical</p>
  </div>
</body>
</html>
